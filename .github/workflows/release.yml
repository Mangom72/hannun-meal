name: Signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      MEAL_API_BASE_URL: ${{ vars.MEAL_API_BASE_URL }}
      SCHOOL_DIRECTORY_BASE_URL: ${{ vars.SCHOOL_DIRECTORY_BASE_URL }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require the official repository and trusted ref
        run: |
          test "$GITHUB_REPOSITORY" = "Mangom72/hannun-meal"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Manual releases must run from main.' >&2
            exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validate release version
        id: version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          props=dict(line.split('=',1) for line in Path('version.properties').read_text().splitlines() if '=' in line)
          version=props['VERSION_NAME']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          assert 0<int(props['VERSION_CODE'])<=2147483647
          tag='v'+version
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF']=='refs/tags/'+tag, 'Tag does not match version.properties'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('tag='+tag+'\n')
          PY
      - name: Test before exposing signing credentials
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintDebug
          python3 -m unittest discover -s scripts/tests -v
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value=os.environ['ANDROID_KEYSTORE_BASE64']
          if not value: raise SystemExit('Missing ANDROID_KEYSTORE_BASE64 secret')
          path=Path(os.environ['RUNNER_TEMP'])/'release.p12'
          path.write_bytes(base64.b64decode(value,validate=True))
          path.chmod(0o600)
          PY
      - name: Build with the persistent release key
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify APK and generate update metadata
        run: |
          python3 scripts/check_client_security.py --apk app/build/outputs/apk/release/app-release.apk
          python3 scripts/create_update_manifest.py --output "$RUNNER_TEMP/distribution"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-release
          path: ${{ runner.temp }}/distribution/
          retention-days: 3
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-release
          path: distribution
      - name: Publish the verified pair atomically through a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This version already has a release. Increase version.properties; never overwrite a shipped APK.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" distribution/hannun-meal.apk distribution/update.json \
            --draft --target "$SOURCE_SHA" --title "한눈급식 $RELEASE_TAG" --notes-file distribution/release-notes.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
